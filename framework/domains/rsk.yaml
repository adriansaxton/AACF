    dependencies: [RSK-02, DAT-05]
    mappings: []
    status: reviewed
    version: 1.0.0

  - id: RSK-04
    title: Legal and regulatory obligations
    objective: >
      The organisation keeps a current view of the laws, regulations and standards that apply to
      its use of AI, with an owner for each obligation and a way of checking it is met.
    rationale: >
      Obligations on AI come from many places at once: data protection, equality, sector
      regulation, consumer and employment law, and new AI-specific rules. Without one maintained
      view, obligations are missed or each team interprets them differently.
    levels:
      1: "No view of which obligations apply to AI use; legal advice is sought only when a problem arises."
      2: "Some obligations are known and tracked, typically data protection, but the view is incomplete, unowned or out of date."
      3: "An owned, reviewed register of AI obligations guides design and approval, and each use records its regulatory role, duties, regulator contact and how obligations are shared."
      4: "Compliance with each obligation is checked and reported, and new or changed obligations are assessed for effect within a set time."
      5: "The organisation anticipates regulatory change, shapes its practice ahead of it, and contributes to consultations where it has relevant experience."
    criteria:
      - {id: RSK-04.1, applies: core, text: "A maintained register lists the obligations that apply to the organisation's use of AI, with a named owner for each."}
      - {id: RSK-04.2, applies: core, text: "The register of obligations is reviewed on a set cycle."}
      - {id: RSK-04.3, applies: core, text: "The register is used when uses of AI are designed and approved."}
      - {id: RSK-04.4, applies: core, text: "Legal advice is taken when each use of AI is designed and when it changes materially."}
      - {id: RSK-04.5, applies: core, text: "For each use of AI, the organisation's regulatory role, for example provider or deployer, is recorded and checked again when the purpose, branding or system changes."}
      - {id: RSK-04.6, applies: core, text: "For each use of AI, the reporting duties that follow from that role are recorded, with a named owner for contact with regulators."}
      - {id: RSK-04.7, applies: core, text: "For each use of AI, a record shows how legal obligations are split between suppliers, the organisation and users."}
      - {id: RSK-04.8, applies: core, text: "Each party is told its share of the legal obligations for a use of AI."}
    questions:
      - "Which laws, regulations and standards apply to your use of AI, and where is that recorded?"
      - "Who owns each obligation, and how do you know it is being met?"
      - "How would you find out about a new obligation, and how quickly would you act on it?"
    evidence:
      - "The obligations register, with owners and review dates"
      - "Compliance check records or legal sign-off for recent uses of AI"
      - "Regulatory role recorded for each use, with re-check records and the named regulator contact"
    guidance:
      steps:
        - "Build a register of laws, regulations and standards that apply to AI use, name an owner for each obligation and set a review cycle."
        - "For each use, record the organisation's regulatory role (for example provider or deployer), the reporting duties that follow and a named owner for contact with regulators, and re-check the role when purpose, branding or the system changes."
        - "Record for each use how legal obligations are split between suppliers, the organisation and users, and tell each party its share."
        - "Make the register part of design and approval, with legal advice taken at design and on material change."
      pitfalls:
        - "Treating the register as a legal team document that delivery teams never use."
        - "Missing a change of regulatory role when a bought system is rebranded or repurposed."
      artefacts:
        - "AI obligations register with owners"
        - "Per-use regulatory role and responsibility split record"
