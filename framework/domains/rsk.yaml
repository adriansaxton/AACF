# RSK: Risk, Ethics & Compliance
# How much AI risk the organisation accepts, how it assesses risk and impact, and how it meets its legal and ethical duties.
# Phase 1 draft, 2026-11-09. Written from scratch from the record shape agreed in D0.4.
# Mappings are left empty until Phase 2 (each one checked at source).
# Level 0 (Absent) is generic and defined in meta.yaml; each control defines levels 1 to 5.

domain: RSK
name: "Risk, Ethics & Compliance"
summary: >
  Sets out how the organisation decides how much AI risk it will accept, assesses the risks and
  effects of each use of AI, and meets its legal, regulatory and ethical obligations. Assessment
  should be proportionate: a quick check for low-risk use, and deeper work where people's rights,
  safety or livelihoods could be affected.

controls:

  - id: RSK-01
    title: AI risk appetite
    objective: >
      The board or equivalent has approved a statement of how much AI risk the organisation will
      accept, broken down by kind of risk, and it is used in decisions.
    rationale: >
      Without a stated appetite, each approver applies their own tolerance, so similar uses get
      different answers and nobody can say whether the organisation is taking too much risk or too
      little. A board-approved appetite gives approvers a common reference and makes risk
      acceptance a deliberate choice.
    levels:
      1: "No statement of AI risk appetite; tolerance depends on whoever is deciding."
      2: "AI is mentioned in the general risk appetite, or a draft AI statement exists, but it does not distinguish kinds of risk or is not approved."
      3: "A board-approved, owned AI risk appetite sets tolerances by kind of risk, has a review date and is referred to in approval decisions."
      4: "Exposure across live and proposed uses is reported against the appetite, and decisions that exceed it are escalated and recorded."
      5: "The appetite is recalibrated from evidence of outcomes, incidents and external change, and the board reviews whether it is enabling the intended use of AI."
    criteria:
      - {id: RSK-01.1, applies: core, text: "A board-approved AI risk appetite sets a tolerance for each relevant kind of risk, such as harm to people, legal, reputational and operational risk."}
      - {id: RSK-01.2, applies: core, text: "The AI risk appetite has a named owner and a review date."}
      - {id: RSK-01.3, applies: core, text: "Approval decisions on uses of AI refer to the risk appetite."}
    questions:
      - "Has the board approved a statement of how much AI risk the organisation will accept?"
      - "Does it set different tolerances for different kinds of risk?"
      - "How do approvers use it when deciding whether a use of AI can go ahead?"
    evidence:
      - "The approved AI risk appetite statement, with approval record and review date"
      - "Approval records for uses of AI that refer to the appetite"
      - "Risk reports comparing exposure with the appetite"
    guidance:
      steps:
        - "Agree the kinds of AI risk that matter to the organisation, for example harm to people, legal, reputational and operational."
        - "For each kind, write a tolerance statement saying what level of risk is acceptable, using the organisation's existing risk scale where possible."
        - "Name an owner and review date, and get the appetite approved by the board or equivalent."
        - "Add a reference to the appetite in AI approval templates so approvers must state how each decision fits it (see GOV-03)."
      pitfalls:
        - "Writing one overall tolerance that does not separate different kinds of risk."
        - "Approving the appetite but never citing it in actual decisions."
      artefacts:
        - "AI risk appetite statement by kind of risk"
        - "Approval template section referencing the appetite"
    owner: {accountable: executive_sponsor, contributors: [risk_lead, ai_governance_lead]}
    lifecycle: [strategy, design]
    applicability: core
    dependencies: [GOV-02]
    mappings: []
    status: reviewed
    version: 1.0.0

  - id: RSK-02
    title: AI risk assessment method
    objective: >
      The organisation uses one consistent, documented method to assess the risks of each use of
      AI, and the results feed its corporate risk management.
    rationale: >
      Different teams assessing AI risk in different ways produce results that cannot be compared
      or added up. A single method, built into the existing risk process, lets the organisation see
      its overall AI risk and makes sure the risks particular to AI are not missed.
    levels:
      1: "AI risk is assessed, if at all, by individual judgement with no common method."
      2: "A method or checklist exists, but it is used in some areas only, does not cover risks particular to AI, or sits outside corporate risk management."
      3: "A documented, proportionate method assesses every use of AI before approval and in live use, records treatment and residual risk, and feeds corporate risk registers."
      4: "Assessments are quality checked, and the AI risk profile, including trends in residual risk, is reported to the oversight forum."
      5: "The method is refined from incidents, near misses and assessment reviews, and its results are shown to predict where problems occur."
    criteria:
      - {id: RSK-02.1, applies: core, text: "A documented AI risk assessment method, proportionate to risk tier, covers risks particular to AI as well as general risks."}
      - {id: RSK-02.2, applies: core, text: "Every use of AI is assessed with the method before approval."}
      - {id: RSK-02.3, applies: core, text: "Each use of AI is assessed again during live use and on material change."}
      - {id: RSK-02.4, applies: core, text: "Assessment results are recorded in the corporate risk registers."}
      - {id: RSK-02.5, applies: core, text: "Each assessment records the treatment chosen for each risk and the controls applied, with the reasons for choosing them."}
      - {id: RSK-02.6, applies: core, text: "Each assessment records the residual risk."}
      - {id: RSK-02.7, applies: [GEN], text: "The method covers the recognised generative AI risk categories."}
    questions:
      - "How is the risk of a proposed use of AI assessed, and is the method the same across the organisation?"
      - "Does the method cover risks particular to AI, such as wrong outputs, drift or misuse, alongside general ones?"
      - "Where do assessment results go, and when is a use reassessed?"
    evidence:
      - "The documented risk assessment method and guidance"
      - "A sample of completed assessments for recent uses of AI"
      - "Corporate or departmental risk registers showing AI risks"
      - "Risk treatment records showing the controls selected for each use and why"
      - "Reassessment records for live uses, with residual risk recorded"
    guidance:
      steps:
        - "Write a risk assessment method with depth scaled to risk tier, covering AI-specific risks (such as error, drift, misuse and opacity) as well as general ones, and the recognised risk categories for generative AI."
        - "Require each assessment to record the treatment chosen for each risk, the controls applied with the reasons for choosing them, and the residual risk."
        - "Apply the method to every use before approval, and again during live use and on material change."
        - "Record results in the corporate risk registers using the organisation's standard scales."
      pitfalls:
        - "Assessing once at approval and never again as the use or its data changes."
        - "Keeping AI risks in a separate register that corporate risk management never sees."
      artefacts:
        - "AI risk assessment method and template by tier"
        - "AI risk catalogue including generative AI categories"
        - "Treatment and controls record with reasons"
    owner: {accountable: risk_lead, contributors: [ai_governance_lead, business_owner, security_lead]}
    lifecycle: [design, acquire_build, deploy, operate]
    applicability: core
    dependencies: [RSK-01]
    mappings: []
    status: reviewed
    version: 1.0.0

  - id: RSK-03
    title: Impact assessment before deployment
    objective: >
      Before a use of AI goes live, its likely effects on people and groups (including equality,
      privacy, rights and safety) and on society and the environment are assessed to a depth that
      matches its risk, and the findings are acted on.
    rationale: >
      Risk assessment looks at the risk to the organisation; impact assessment looks at what the
      use of AI could do to the people it touches. Some harms, such as a group being treated less
      favourably, only appear when someone asks that question directly and before the system is in
      use.
    levels:
      1: "Effects on people are not assessed before go-live, or only after a complaint."
      2: "Some impact assessment happens, for example for data protection, but equality, rights and safety are not covered consistently, or findings are not acted on."
      3: "A proportionate impact assessment covering people, workforce, society and environment is signed off before each in-scope use goes live, kept current, and its mitigations tracked."
      4: "Completion and quality of impact assessments are checked, assessments are revisited after significant change, and actual effects in live use are compared with what was predicted."
      5: "Impact assessment shapes design from the start, and the method is improved from evidence of effects it missed."
    criteria:
      - {id: RSK-03.1, applies: core, text: "Impact assessments, proportionate to risk, cover equality, privacy (including sensitive inferences about people), rights and safety."}
      - {id: RSK-03.2, applies: core, text: "Impact assessments cover effects on the workforce: workload, working conditions, skills and progression."}
      - {id: RSK-03.3, applies: core, text: "Impact assessments cover wider societal and environmental effects."}
      - {id: RSK-03.4, applies: core, text: "An impact assessment is completed and signed off before each in-scope use of AI goes live."}
      - {id: RSK-03.5, applies: core, text: "Each impact assessment is kept current while the use is live."}
      - {id: RSK-03.6, applies: core, text: "Mitigations identified in impact assessments are tracked."}
      - {id: RSK-03.7, applies: core, text: "For public-facing AI assistants, the impact assessment also covers over-reliance and people treating the AI as human."}
    questions:
      - "Which uses of AI need an impact assessment before going live, and who decides?"
      - "What does the assessment cover beyond data protection?"
      - "Can you show a case where an impact assessment changed the design or stopped a deployment?"
    evidence:
      - "The impact assessment template and guidance on proportionality"
      - "Completed and signed-off assessments for recent deployments"
      - "Records of mitigations and their completion"
      - "Impact assessment reviews during live use"
    guidance:
      steps:
        - "Build an impact assessment template covering equality, privacy (including sensitive inferences about people), rights, safety, effects on the workforce (workload, working conditions, skills and progression) and wider societal and environmental effects."
        - "Add questions on over-reliance and people treating the AI as human for public-facing assistants."
        - "Scale the depth of assessment to risk and require sign-off before every in-scope use goes live."
        - "Track mitigations to completion and review the assessment during use and when the use changes."
      pitfalls:
        - "Treating the impact assessment as a form to finish rather than findings to act on."
        - "Leaving out effects on the organisation's own staff."
      artefacts:
        - "AI impact assessment template with proportionate depth"
        - "Mitigation tracker"
