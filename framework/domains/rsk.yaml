    mappings: []
    status: reviewed
    version: 1.0.0

  - id: RSK-05
    title: Ethical principles in practice
    objective: >
      The organisation has adopted ethical principles for AI and applies them through a working
      review route that can change or stop a use of AI.
    rationale: >
      Many organisations publish principles that have no effect on what they build or buy.
      Principles only matter when there is a route that tests real proposals against them and has
      the authority to require changes.
    levels:
      1: "No adopted principles; ethical questions are left to individuals."
      2: "Principles are published, but there is no route for applying them to real cases, or the route is advisory and rarely used."
      3: "Adopted ethical principles are applied through a working review route with triggers and authority, used at the outset of each use and for recorded trade-offs."
      4: "Review outcomes are tracked to completion, the route's use and effect are reported, and cases that should have been reviewed but were not are identified."
      5: "Principles and the review route are refined from case experience and stakeholder feedback, and reasoning from past cases is reused as guidance."
    criteria:
      - {id: RSK-05.1, applies: core, text: "Adopted ethical principles for AI are applied through a defined review route with clear triggers."}
      - {id: RSK-05.2, applies: core, text: "The review route has authority to require changes to a use of AI."}
      - {id: RSK-05.3, applies: core, text: "The review route records its outcomes."}
      - {id: RSK-05.4, applies: core, text: "The review route is used across the organisation."}
      - {id: RSK-05.5, applies: core, text: "Each use of AI is assessed against the adopted principles at the outset, and the result informs its approval tier."}
      - {id: RSK-05.6, applies: core, text: "Where principles conflict, the trade-off goes through the review route and is tested for necessity and proportionality."}
      - {id: RSK-05.7, applies: core, text: "Each trade-off between principles is recorded with the alternatives considered and the reasons for the choice."}
    questions:
      - "What ethical principles has the organisation adopted for AI?"
      - "Which proposals go to ethical review, and what can the review require?"
      - "Can you give an example where ethical review changed or stopped a use of AI?"
    evidence:
      - "Record of trade-offs between principles, with alternatives and reasons"
      - "The adopted principles and the terms of reference for the review route"
      - "Records of ethical reviews and their outcomes"
      - "Principles assessments at the outset and the approval tier they informed"
    guidance:
      steps:
        - "Adopt a short set of ethical principles for AI and get them approved."
        - "Set up a review route with clear triggers, recorded outcomes and authority to require changes or stop a use, and make it available across the organisation."
        - "Assess each use against the principles at the outset and use the result to set its approval tier (GOV-03)."
        - "Where principles conflict, send the trade-off through the review route, test it for necessity and proportionality, and record the alternatives considered and the reasons."
      pitfalls:
        - "Publishing principles with no route that can change or stop a use."
        - "Resolving conflicts between principles informally, leaving no record of the trade-off."
      artefacts:
        - "Ethical principles statement"
        - "Principles screening checklist for new uses"
        - "Ethics review record including trade-off analysis"
