    version: 1.0.0

  - id: RSK-06
    title: Fairness and bias management
    objective: >
      Unfair bias is identified, tested for and reduced at each stage of a use of AI, from design
      through to live operation.
    rationale: >
      AI can reproduce or amplify unfairness present in its data, its design or how it is used,
      and the effect often falls on groups already at a disadvantage. Bias needs managing across
      the lifecycle because it can appear after go-live as data and users change.
    levels:
      1: "Bias is not considered, or is assumed not to be present."
      2: "Bias is considered for some uses, usually at design, but testing is informal and live use is not checked."
      3: "A documented fairness approach defines groups and measures for each in-scope use, tests before release, records mitigations and proxies, and monitors fairness in live use."
      4: "Fairness breaches in live use lead to investigation, root-cause analysis and action, and fairness results are reported to the oversight forum."
      5: "Fairness methods are improved from monitoring results and external developments, and lessons are shared across uses."
    criteria:
      - {id: RSK-06.1, applies: core, text: "A documented approach to fairness and bias is applied across the organisation."}
      - {id: RSK-06.2, applies: core, text: "For each in-scope use of AI, the groups at risk and the fairness measures that matter are defined."}
      - {id: RSK-06.3, applies: core, text: "Each in-scope use of AI is tested for fairness before release."}
      - {id: RSK-06.4, applies: core, text: "Fairness mitigations are recorded for each in-scope use of AI."}
      - {id: RSK-06.5, applies: core, text: "Fairness is monitored in live use through MON-02."}
      - {id: RSK-06.6, applies: core, text: "Proxies for protected characteristics are identified, and any use of them is recorded with reasons."}
    questions:
      - "For a given use of AI, which groups could be treated unfairly, and how was that worked out?"
      - "What testing for bias is done before release, and against what measures?"
      - "How would you know if a live use started producing unfair results?"
    evidence:
      - "The documented approach to fairness and bias"
      - "Bias test results and mitigation records for recent uses"
      - "Live fairness monitoring reports"
    guidance:
      steps:
        - "Write a fairness approach for the organisation explaining how groups at risk are identified, how fairness measures are chosen and how testing is done."
        - "For each in-scope use, define the groups at risk and the fairness measures that matter, and identify proxies for protected characteristics, recording any use of them with reasons."
        - "Test against the chosen measures before release and record the mitigations applied."
        - "Hand the fairness measures to live monitoring (MON-02) so they are tracked in use."
      pitfalls:
        - "Testing only overall accuracy, which can hide poor results for smaller groups."
        - "Removing protected characteristics but ignoring proxies that carry the same information."
      artefacts:
        - "Fairness approach document"
        - "Per-use fairness test plan and results record"
