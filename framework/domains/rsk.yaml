  - id: RSK-09
    title: Risk of AI from suppliers
    objective: >
      Before AI in a bought product or service is used, and when it changes, the organisation
      assesses what it does, how it uses data, how the supplier changes the model, and what
      assurance the supplier offers.
    rationale: >
      Much of an organisation's AI arrives inside products it has bought, often switched on by a
      supplier update. The organisation carries the risk of that AI even though it did not build
      it, so it needs to understand it as well as it would its own.
    levels:
      1: "AI in bought products is not identified or assessed; it is accepted as part of the product."
      2: "Some suppliers are asked about AI, but questions are ad hoc, cover only new purchases, or miss updates that add AI to existing products."
      3: "Standard due diligence covers AI in new and existing bought products before use and at intervals, feeds each risk assessment, and keeps unregistered high-risk AI out."
      4: "Gaps in supplier assurance are tracked to closure and reported, and reassessment results inform renewal and purchasing decisions."
      5: "Due diligence is refined from incidents and supplier experience, and the organisation's requirements shape what suppliers offer."
    criteria:
      - {id: RSK-09.1, applies: core, text: "A standard due diligence process covers AI in both new and existing bought products and services."}
      - {id: RSK-09.2, applies: core, text: "The due diligence covers function, data use, model change, content safeguards, energy use and wider sustainability practice, and supplier assurance."}
      - {id: RSK-09.3, applies: core, text: "Before AI from a supplier is used, its regulatory status is confirmed and the provider's instructions for use are obtained."}
      - {id: RSK-09.4, applies: core, text: "Due diligence confirms that AI from others is consistent with the organisation's adopted principles."}
      - {id: RSK-09.5, applies: core, text: "Due diligence results feed the risk assessment for each use of AI."}
      - {id: RSK-09.6, applies: core, text: "Supplier AI risk is reassessed on significant change and at set intervals."}
      - {id: RSK-09.7, applies: [HIR], text: "High-risk AI that is not registered where the law requires it is not used, and the provider or distributor is told."}
    questions:
      - "How do you find out whether a bought product or service contains AI, including after an update?"
      - "What do you ask suppliers about how their AI works, uses your data and changes over time?"
      - "What assurance do suppliers provide, and what happens when it is not enough?"
    evidence:
      - "The supplier AI due diligence questionnaire or process"
      - "Completed due diligence records for recent purchases and updates"
      - "Regulatory status checks and provider instructions for use, held for bought AI"
    guidance:
      steps:
        - "Build a due diligence questionnaire covering function, data use, model change, content safeguards, energy use and wider sustainability practice, assurance, and consistency with the adopted principles (RSK-05)."
        - "Apply it to AI in new and existing products and services, confirming regulatory status and obtaining the provider's instructions for use before use."
        - "Do not use high-risk AI that is not registered where the law requires it, and tell the provider or distributor."
        - "Feed the results into the risk assessment for each use (RSK-02) and reassess on significant change and at set intervals."
      pitfalls:
        - "Checking only new purchases and missing AI added to existing products by supplier updates."
        - "Accepting supplier marketing claims as assurance without asking for evidence."
      artefacts:
        - "Supplier AI due diligence questionnaire"
        - "Supplier AI reassessment schedule"
    owner: {accountable: risk_lead, contributors: [delivery_lead, security_lead, data_owner]}
    lifecycle: [acquire_build, operate]
    applicability: core
    dependencies: [RSK-02, GOV-06]
