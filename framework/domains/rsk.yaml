  - id: RSK-07
    title: Human oversight proportionate to risk
    objective: >
      Each use of AI has human oversight designed to match its risk, stating who reviews, at which
      point, and with what authority to override or stop it.
    rationale: >
      Putting a person in the loop does not help if they lack the time, information or authority to
      disagree with the system. Oversight has to be designed for each use so that human control is
      real where it is needed and not imposed as a formality where it adds nothing.
    levels:
      1: "Oversight is not designed; whether anyone checks AI outputs depends on the individual."
      2: "Some uses have a human review step, but its purpose, timing and authority are not defined, or reviewers lack the information to challenge outputs."
      3: "Every use of AI has a documented, risk-based oversight model with trained reviewers, tested before go-live to show they can detect problems and intervene."
      4: "Oversight is checked in practice, for example override rates and review times, and signs of rubber-stamping or overload are acted on."
      5: "Oversight designs are refined from evidence of where human review adds value and where it does not."
    criteria:
      - {id: RSK-07.1, applies: core, text: "For every use of AI, a documented oversight model, set according to risk, states who reviews, when, with what information, and their authority to override or stop the use."}
      - {id: RSK-07.2, applies: core, text: "Reviewers are trained for their oversight role."}
      - {id: RSK-07.3, applies: core, text: "The oversight design is tested before go-live to show that reviewers can detect problems and intervene in time."}
      - {id: RSK-07.4, applies: [AGT], text: "Agent actions that are consequential or hard to reverse need a person's approval before they take effect, and the oversight model lists which actions these are."}
    questions:
      - "For a given use of AI, who reviews its outputs, at what point, and can they override it?"
      - "How was the level of oversight chosen, and how does it relate to the risk?"
      - "How do you know reviewers are genuinely checking rather than approving by default?"
    evidence:
      - "List of agent actions that need a person's approval, with approval records"
      - "Documented oversight models for in-scope uses of AI"
      - "Training records for people in oversight roles"
      - "Override and review data from live uses"
    guidance:
      steps:
        - "Define a small set of oversight models (for example a person decides, a person reviews before action, a person monitors) and link each to risk tiers."
        - "For every use, document the chosen model, who reviews, when, with what information, and their authority to override or stop."
        - "Train reviewers for their role, including the limits of the AI and the risk of over-trusting it (see PPL-05)."
        - "Test the oversight design before go-live to show reviewers can detect problems and intervene in time."
      pitfalls:
        - "Naming a reviewer who lacks the time, information or authority to intervene."
        - "Assuming oversight works without testing whether reviewers actually catch errors."
      artefacts:
        - "Oversight model catalogue linked to risk tiers"
        - "Per-use oversight design record"
        - "Oversight test scenario pack"
