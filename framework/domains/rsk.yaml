  - id: RSK-08
    title: Explanation and challenge for affected people
    objective: >
      People affected by decisions that AI supports can find out that AI was involved, get an
      explanation they can understand, and challenge the outcome through a route that can change it.
    rationale: >
      People are entitled to understand decisions made about them, and some have legal rights to do
      so. A working route to explanation and challenge also corrects individual errors and shows the
      organisation where a system is going wrong.
    levels:
      1: "Affected people are not told AI was involved and have no specific route to question the outcome."
      2: "Explanations or challenge are available for some uses, or on request only, and the route may not be able to change outcomes."
      3: "People know when AI is involved in decisions about them or in their interactions, can get a meaningful explanation, and can challenge outcomes through human review."
      4: "Requests for explanation and challenges are logged, outcomes and response times are measured, and patterns are fed back to the owners of the use."
      5: "Explanation and challenge are designed in from the start, and the route is improved from the experience of the people who use it."
    criteria:
      - {id: RSK-08.1, applies: core, text: "For every use of AI that supports decisions about people, those people are told that AI was involved."}
      - {id: RSK-08.2, applies: core, text: "People affected by such a decision can obtain a meaningful explanation of it."}
      - {id: RSK-08.3, applies: core, text: "People affected by such a decision can challenge the outcome through a defined route with human review and authority to change it."}
      - {id: RSK-08.4, applies: core, text: "People are told when they are interacting with AI, at first contact, clearly and accessibly, unless it is obvious."}
      - {id: RSK-08.5, applies: [HIR], text: "People are told when they are exposed to emotion recognition or biometric categorisation, at first contact, clearly and accessibly, unless it is obvious."}
    questions:
      - "How do people know when AI has contributed to a decision about them?"
      - "What explanation can they get, and is it one a non-specialist can understand?"
      - "How can they challenge an outcome, and how often do challenges succeed?"
    evidence:
      - "Notices or communications telling people AI is involved"
      - "The documented explanation and challenge route"
      - "A log of challenges and their outcomes"
      - "Notices shown to people at first contact with AI services"
    guidance:
      steps:
        - "Identify every use of AI that supports decisions about people."
        - "For each, write a clear notice telling people AI was involved, and set up a way for them to obtain a meaningful explanation."
        - "Set up a challenge route with human review and authority to change the outcome."
        - "Tell people clearly and accessibly at first contact when they are interacting with AI or are exposed to emotion recognition or biometric categorisation, unless it is obvious."
      pitfalls:
        - "Offering an explanation that describes the technology but not why this person got this outcome."
        - "Routing challenges to staff who cannot change the decision."
      artefacts:
        - "AI involvement notice template"
        - "Explanation and challenge procedure"
    owner: {accountable: business_owner, contributors: [risk_lead, data_owner, ai_governance_lead]}
    lifecycle: [design, deploy, operate]
    applicability: core
