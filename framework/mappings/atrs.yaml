# Algorithmic Transparency Recording Standard (ATRS) mapping
# One entry per part of an ATRS record (Tier 1, and each Tier 2 section of the v4.0 template), plus the obligations in
# the Mandatory Scope and Exemptions Policy that bear on an organisation (which bodies must publish, which tools,
# when, what may be withheld, and the supply chain). Labels are our own short descriptions.
# Sources used: resources/sources/ATRS_V4.0__FINAL.xlsx (template v4.0) and resources/sources/atrs-scope-policy.txt.md
# (Mandatory Scope and Exemptions Policy, GDS, published 17 December 2024). Both OGL v3.0.
#
# Template layout as found. Tier 1 is the sheet "1. Summary" (section "Summary Information"). Tier 2 is eight sheets:
#   "2.1. Owner" (Owner and Responsibility), "2.2. Description" (Description and Rationale),
#   "2.3. Deployment" (Deployment Context), "2.4.1. Tool" (Tool Specification), "2.4.2. Model" (Model Specification),
#   "2.4.3. Development Data " (Development Data Specification), "2.4.4. Operational Data" (Operational Data
#   Specification), "2.5. Risks" (Risks, Mitigations and Impact Assessments).
# Refs use the section heading after "Tier 2", since the tab names are abbreviated.
# Not itemised: "Info" (guidance), "0. Metadata" (title, organisation, phase, region; folded into the Tier 1 note),
#   "(Optional) Dataset card" (folded into the development data note), "(Optional) Extra space", and the helper sheets
#   "All data", "Markdown", "DSA table" and "Validation" (the first three still carry the older v3 field list).
#
# The question asked of each item: if an organisation meets our controls at Level 3, would it have the information
# and the process to complete this part of an ATRS record, or to meet this scope obligation?
# strength: direct  = yes, for the item's substance, from the control's Level 3 wording
#           partial = some of it; the note says what is missing
# An item with no controls, or whose note starts "gap:", is a gap: our controls do not adequately meet it. The note
# suggests a fix, preferring a tightening of an existing control in jurisdiction-neutral wording; ATRS specifics stay
# in this file.
# Strictness: generic catch-all wording (for example GOV-09 "in the required format") never earns "direct".
# Note on altitude: Tier 2 asks for system-level facts (architecture, model, datasets). This framework is
# organisation-level, so the test is whether Level 3 makes the organisation record those facts for each use, not
# whether a record for a particular tool exists.

source: ATRS
status: draft
mapped_by: drafted with AI assistance and reviewed by the author, 2026-11-09
items:

  # ---------------------------------------------------------------- Tier 1
  - ref: "Tier 1 Summary information"
    label: Give a plain, non-technical public summary of the tool, what it is and why it is used, with a web link and contact
    controls: [{id: GOV-06, strength: direct}, {id: GOV-09, strength: partial}, {id: MON-06, strength: partial}, {id: CUL-08, strength: partial}]
    note: "GOV-06 holds the name, purpose and status of every use, which gives the what, the why and the metadata phase field; GOV-09 publishes the record. Not required at Level 3: a public contact point for each use (MON-06 gives users and affected people a feedback route, and GOV-09 only tracks public questions at Level 4), and the region a tool affects."

  # ---------------------------------------------------------------- Tier 2
  - ref: "Tier 2 Owner and responsibility"
    label: Say which organisation and team are responsible, who the senior owner is, and which suppliers were involved and on what terms
    controls: [{id: GOV-05, strength: direct}, {id: TEC-07, strength: partial}, {id: RSK-09, strength: partial}, {id: OPM-04, strength: partial}, {id: OPM-05, strength: partial}]
    note: "GOV-05 names business, data, technical and assurance owners for each use in the inventory. Suppliers come from TEC-07 (recorded supplier dependencies per service), RSK-09 (due diligence) and OPM-05 (an owner per supplier); OPM-04 contract terms on data use and rights give the supplier's data access terms. The supplier's role in development or deployment and the procurement route are held in procurement records, not with the use of AI."
  - ref: "Tier 2 Description and rationale"
    label: Describe how the tool works, its users, scope and limits, its benefits, the process it replaced and the alternatives considered
    controls: [{id: TEC-05, strength: direct}, {id: POR-05, strength: partial}, {id: OPM-02, strength: partial}, {id: MON-01, strength: partial}, {id: GOV-06, strength: partial}]
    note: "TEC-05 Level 3 requires documentation for each version to state the intended purpose and users, how it works, its inputs and outputs, known limitations and where it must not be used or relied on. The rationale comes from POR-05 (benefits, assumptions and options), OPM-02 (why configure, procure, build or wait was chosen) and MON-01 (a baseline of the process being replaced)."
  - ref: "Tier 2 Deployment context"
    label: Explain how the tool fits the wider process, how people review its output, how often it is used, the training needed and how the public can appeal
    controls: [{id: RSK-07, strength: direct}, {id: RSK-08, strength: direct}, {id: TEC-04, strength: partial}, {id: PPL-05, strength: partial}, {id: MON-05, strength: partial}, {id: MON-02, strength: partial}]
    note: "RSK-07 states who reviews output, when, with what information and authority, and that reviewers are trained; MON-05 gives independent assurance of that review; RSK-08 gives affected people a challenge route with human review. TEC-04 documents data flows into core systems and PPL-05 sets role-based learning. Frequency and scale of use are not required to be recorded, though MON-02 monitoring and OPM-03 usage tracking would produce the figures."
  - ref: "Tier 2 Tool specification"
    label: Describe the tool's architecture, inputs and outputs, maintenance and review schedule, and the models in it
    controls: [{id: TEC-02, strength: partial}, {id: TEC-04, strength: partial}, {id: TEC-05, strength: partial}, {id: TEC-07, strength: partial}, {id: OPM-07, strength: partial}, {id: GOV-06, strength: partial}]
    note: "TEC-05 documentation states how each use works and its inputs and outputs, and GOV-06 links each inventory entry to its models, data sets and integrations, which gives the models field; architecture comes through TEC-02 design review and TEC-04 documented integrations. Still missing: a stated maintenance and review schedule for each tool, including how often models are retrained (TEC-07 refresh plans and OPM-07 change management cover maintenance without fixing a schedule)."
  - ref: "Tier 2 Model specification"
    label: For each model the organisation trained, tuned or tested, give its name, version, task, inputs, outputs, design, test performance and datasets
    controls: [{id: TEC-06, strength: direct}, {id: DAT-08, strength: direct}, {id: TEC-05, strength: partial}, {id: TEC-07, strength: partial}]
    note: "TEC-06 records acceptance criteria, test data and results for each release (model performance); DAT-08 records every training, tuning and test data set and links it to the models that used it (datasets and their purposes); TEC-05 versions models, with their data sets, and its documentation states how the model works and its inputs and outputs; TEC-07 records the model and supplier. Model type and design are not required to be recorded as such. The template lets off-the-shelf models the organisation has not trained or tested skip this section."
  - ref: "Tier 2 Development data specification"
    label: Describe the data used to develop the tool, its size, sensitive attributes, representativeness, cleaning, collection, storage and sharing
    controls: [{id: DAT-08, strength: direct}, {id: DAT-03, strength: direct}, {id: DAT-05, strength: direct}, {id: DAT-07, strength: direct}, {id: DAT-04, strength: partial}, {id: DAT-06, strength: partial}, {id: DAT-02, strength: partial}, {id: RSK-06, strength: partial}]
    note: "DAT-08 gives source, collection method, rights and limits; DAT-03 representativeness and completeness for the purpose; DAT-05 purpose compatibility when data is repurposed, and fairness; DAT-07 access and sharing agreements; DAT-04 meaning, coverage and limits; DAT-02 the owner responsible for storage; RSK-06 the groups at risk, which covers protected characteristics and proxies. Not explicit: cleaning and pre-processing steps, and retention of development data (DAT-06 names inputs, prompts, outputs and decisions). The optional dataset card draws on the same controls."
  - ref: "Tier 2 Operational data specification"
    label: Describe the data the tool uses in live operation, its sensitive attributes, processing, storage, access and sharing
    controls: [{id: DAT-06, strength: direct}, {id: DAT-07, strength: direct}, {id: DAT-05, strength: partial}, {id: TEC-04, strength: partial}, {id: SEC-04, strength: partial}, {id: RSK-03, strength: partial}, {id: MON-02, strength: partial}]
    note: "DAT-06 covers how inputs, prompts, outputs and logs are kept, retrieved and deleted; DAT-07 who can access them and the sharing agreements; TEC-04 data flows show where operational data comes from; DAT-05, RSK-03 (sensitive inferences) and SEC-04 cover sensitive attributes and their protection. Pre-processing of live data is only touched by MON-02 drift monitoring."
  - ref: "Tier 2 Risks, mitigations and impact assessments"
    label: List the impact assessments done with dates and findings, and the key risks of the tool with their mitigations
    controls: [{id: RSK-03, strength: direct}, {id: RSK-02, strength: direct}, {id: DAT-05, strength: partial}, {id: RSK-06, strength: partial}, {id: SEC-02, strength: partial}]
    note: "RSK-03 is signed off before go-live and covers equality, privacy, rights, safety, societal and environmental effects with tracked mitigations; RSK-02 records each risk, the treatment and controls chosen and the residual risk. DAT-05 feeds the data protection assessment, RSK-06 unfair outcomes and SEC-02 security threats."

  # ---------------------------------------------------------------- Mandatory Scope and Exemptions Policy
  - ref: "Scope mandatory organisations"
    label: Know whether the organisation is one that must publish records, and when the requirement reaches it
    controls: [{id: RSK-04, strength: direct}, {id: GOV-09, strength: partial}]
    note: "RSK-04 keeps a register of the laws, regulations and standards that apply, with an owner for each, which is where a publication mandate and its rollout phase are recorded; GOV-09 publishes to the extent obligations and public role require. For bodies outside the mandate the standard is recommended, and publishing is a choice GOV-09 allows but does not require."
  - ref: "Scope tools in scope"
    label: Identify which uses of AI must have a record, namely those with significant influence on decisions affecting the public or that interact directly with the public
    controls: [{id: GOV-09, strength: direct}, {id: GOV-06, strength: partial}, {id: RSK-08, strength: partial}, {id: RSK-04, strength: partial}]
    note: "GOV-09 Level 3 requires a decision for each inventory entry, against the criteria that apply, on whether a record must be published, with the reason recorded. For a mandated body the criteria are the ATRS ones (significant influence on decisions affecting the public, or direct interaction with the public), which stay in this mapping; RSK-08 identifies uses that support decisions about people or that people interact with."
  - ref: "Scope timing and updates"
    label: Publish once a tool reaches pilot or live use, keep the record current, and update it to show retirement
    controls: [{id: GOV-09, strength: direct}, {id: GOV-06, strength: partial}, {id: POR-09, strength: partial}, {id: POR-04, strength: partial}]
    note: "GOV-09 Level 3 requires published records to be updated when a use changes materially or is retired, on top of an owner and review cycle for each. The stage at which a record is due (pilot or production under ATRS) stays in this mapping; POR-04 stages and GOV-06 status give it, and POR-09 updates the inventory at retirement."
  - ref: "Scope exemptions"
    label: Withhold or summarise only information that access-to-information law would exempt, record the reason, and leave a tool unpublished only if its existence cannot be confirmed
    controls: [{id: GOV-09, strength: direct}, {id: GOV-07, strength: partial}, {id: SEC-04, strength: partial}, {id: RSK-04, strength: partial}]
    note: "GOV-09 Level 3 requires each record to be checked through information access and security routes before release, with the reason recorded for anything withheld, and a publication decision with reasons for each inventory entry. The policy's test (the FOI and related exemptions, applied as if to a request for the full record, and leaving a tool unpublished only where its existence cannot be confirmed) stays in this mapping for the assessor."
  - ref: "Scope supplier transparency"
    label: Tell suppliers from the start that this level of transparency is expected, and work with them so little is withheld for commercial reasons
    controls: [{id: OPM-04, strength: direct}, {id: RSK-09, strength: partial}]
    note: "OPM-04 Level 3 puts transparency terms in every relevant AI contract, including the information the organisation needs to publish about the use, so suppliers know from the start; RSK-09 gathers what the AI does, its data use and assurance before use."
