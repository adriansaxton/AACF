# AACF worked example: completed assessment of an invented organisation (D3.4), updated to the v1.0 rules.
# Every document named in `evidence` and every named role holder is invented. Regenerate the workbook and report
# with the commands in README.md in this folder.
#
# Per control: level (0 to 5, "Insufficient evidence" or "N/A"), criteria_not_met (applicable Level 3 criteria not
# met, for any control below Level 3), confidence, evidence, target (default 3; below 3 needs target_rationale,
# target_approver and target_review), assessor, reviewer (GOV, RSK, SEC, MON and any Level 4 or 5), notes.
# Roadmap fields for the agreed actions: action, action_owner, priority, due, delivery.

profile:
  organisation: Westmere Standards Agency (fictional)
  sector: "UK public sector: arm's-length body that sets and checks technical standards for a regulated industry"
  size: "About 2,000 staff; data team of six; Microsoft 365 Copilot licensed to 600 staff"
  scope_of_assessment: "Whole organisation. All AI in use or in development at November 2026: Microsoft 365 Copilot (agents and plugins switched off in the tenant), the correspondence triage classifier pilot (a model tuned by the data team, planned to go live in January 2027), the guidance library search assistant pilot, and AI features in bought products. Three uses in all, so every use was sampled."
  assessor: "Self-assessment led by the Head of Data (J. Okafor); security controls assessed by the Head of Information Assurance (S. Lindqvist); challenge from the Head of Internal Audit (P. Rourke)"
  assessment_date: 2026-11-09
  assessment_sponsor: "Chief Operating Officer (R. Pellow), executive sponsor for AI"
  notes: Invented organisation for the AACF worked example. Any resemblance to a real body is coincidental.

overlays:
  PUB:
    applies: "Yes"
    reason: "An arm's-length public body with public duties, in mandatory scope for algorithmic transparency records."
  PRV:
    applies: "No"
    reason: "All AI is for Westmere's own use; it offers no AI service, product or model to anyone else."
  HIR:
    applies: "No"
    reason: "No use decides or shapes people's rights, safety or access to services: triage only suggests a team for each letter and a person checks every suggestion, and safety reports arrive through the separate statutory reporting line, not the correspondence mailbox. Revisit at the triage go-live review."
  GEN:
    applies: "Yes"
    reason: "Microsoft 365 Copilot for 600 staff, and the search assistant generates answers from the guidance library."
  AGT:
    applies: "No"
    reason: "No AI acts in other systems: Copilot agents and plugins are switched off and the triage classifier only suggests a route."
  BLD:
    applies: "Yes"
    reason: "The data team tuned the triage classifier on labelled letters and built the search assistant's retrieval pipeline."

